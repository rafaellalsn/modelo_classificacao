<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Formulário de Dados Médicos</title>
</head>
<body>
    <h2>Consulta de Medicamento</h2>
    <form action="/" method="POST">
        
        <label for="sexo">Sexo:</label>
        <select id="sexo" name="sexo" required>
            <option value="0">Masculino</option>
            <option value="1">Feminino</option>
        </select><br><br>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" min="0" required><br><br>

        <label for="pressao">Níveis de Pressão Arterial (PA):</label>
        <select id="pressao" name="pressao" required>
            <option value="0">Baixo</option>
            <option value="1">Normal</option>
            <option value="2">Alto</option>
        </select><br><br>

        <label for="colesterol">Níveis de Colesterol:</label>
        <select id="colesterol" name="colesterol" required>
            <option value="1">Normal</option>
            <option value="2">Alto</option>
        </select><br><br>

        <label for="potassio">Razão Potássio:</label>
        <input type="number" id="potassio" name="potassio" step="0.01" required><br><br>

        <button type="submit">Enviar</button>
    </form>
    {% if predicao is not none %}
        <div>
            <h3>O medicamento indicado para o paciente é: {{predicao}}</h3>
        </div>

        <div>
            {{ grafico|safe }}
        </div>
    {% endif %}
</body>
</html>
